name: Feature request
description: Propose a focused, vendor-neutral improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the public interface and important failure states.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and compatibility
      description: Explain privacy, accounting, delivery-evidence, migration, and vendor-neutrality effects.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not require sharing a real deployment, credential, or recipient record.
          required: true
